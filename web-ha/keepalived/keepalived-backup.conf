! ====================================================================
! Keepalived 配置 — app11 (BACKUP)
! ====================================================================
! VIP:  10.0.0.30
! 网卡: enp125s0f0-br0
! 部署: cp 此文件到 /etc/keepalived/keepalived.conf
!
! 和 MASTER 配置的区别只有 3 处:
!   1. router_id → NGINX_HA_2 (两台机器必须不同)
!   2. state → BACKUP (初始不抢占 VIP)
!   3. priority → 90 (比 MASTER 的 100 低)

global_defs {
    router_id NGINX_HA_2           ! 本机唯一标识；和 MASTER 不同，用于 VRRP 消息中区分节点
    script_user root               ! 以 root 身份执行外部脚本（check_nginx.sh）
    enable_script_security         ! 启用脚本安全检查
}

! ── VRRP 健康检查脚本定义 ────────────────────────────────────────────────
vrrp_script chk_nginx {
    script      "/etc/keepalived/check_nginx.sh"   ! 要执行的健康检查脚本路径
    interval    2                                   ! 检查间隔（秒）；每 2 秒执行一次
    weight      -20                                 ! 故障时本节点优先级减 20；90-20=70 确保不抢占
    fall        3                                   ! 连续失败 3 次才判定为故障；2×3 = 6 秒容错
    rise        2                                   ! 连续成功 2 次才判定为恢复；2×2 = 4 秒防抖
}

! ── VRRP 实例定义（核心）─────────────────────────────────────────────────
vrrp_instance VI_1 {

    state BACKUP                    ! VRRP 初始状态；BACKUP = 启动时不抢占 VIP，等 MASTER 挂了才接管
    interface enp125s0f0-br0       ! 绑定物理网卡；和 MASTER 同一张网卡
    virtual_router_id 51           ! VRRP 路由器 ID (0-255)；★ 必须和 MASTER 一致
    priority 90                    ! 本机优先级 (1-255)；90 < MASTER的100，正常时不抢占
    advert_int 1                   ! VRRP 心跳广播间隔（秒）；★ 必须和 MASTER 一致

    ! ── 单播通信模式 ─────────────────────────────────────────────────
    unicast_peer {
        192.168.131.10       ! app10 的 IP
        192.168.131.11       ! app11 的 IP
    }

    ! ── 认证 ────────────────────────────────────────────────────────
    authentication {
        auth_type PASS             ! 认证类型；PASS = 简单密码认证
        auth_pass EctErp1234       ! 认证密码；★ 必须和 MASTER 完全一致
    }

    ! ── 虚拟 IP 地址（VIP）───────────────────────────────────────────
    virtual_ipaddress {
        10.0.0.30/24 dev enp125s0f0-br0   ! VIP 地址/掩码；和 MASTER 完全一致
    }

    ! ── 健康检查绑定 ─────────────────────────────────────────────────
    track_script {
        chk_nginx                  ! 绑定 chk_nginx 检查项
    }

    ! ── 状态切换通知回调 ────────────────────────────────────────────
    notify_master "/bin/echo '\$(date): 晋升 MASTER, VIP=10.0.0.30' >> /var/log/keepalived-notify.log"
    notify_backup "/bin/echo '\$(date): 降级 BACKUP' >> /var/log/keepalived-notify.log"
    notify_fault  "/bin/echo '\$(date): FAULT 状态! 请立刻排查' >> /var/log/keepalived-notify.log"
}
