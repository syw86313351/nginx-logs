! ====================================================================
! Keepalived 配置 — app10 (MASTER)
! ====================================================================
! VIP:  10.0.0.30
! 网卡: enp125s0f0-br0
! 部署: cp 此文件到 /etc/keepalived/keepalived.conf

global_defs {
    router_id NGINX_HA_1           ! 本机唯一标识；MASTER 和 BACKUP 必须不同，用于 VRRP 消息中区分节点
    script_user root               ! 以 root 身份执行外部脚本（check_nginx.sh），否则可能无权限
    enable_script_security         ! 启用脚本安全检查，防止任意用户写的脚本被 keepalived 执行
}

! ── VRRP 健康检查脚本定义 ────────────────────────────────────────────────
! vrrp_script 定义了一个"检查项"，后续在 vrrp_instance 中通过 track_script 引用
! 脚本返回 0 = 健康，非 0 = 故障
vrrp_script chk_nginx {
    script      "/etc/keepalived/check_nginx.sh"   ! 要执行的健康检查脚本路径
    interval    2                                   ! 检查间隔（秒）；每 2 秒执行一次
    weight      -20                                 ! 故障时本节点优先级减 20；100-20=80 < BACKUP的90 → 触发切换
    fall        3                                   ! 连续失败 3 次才判定为故障；2×3 = 6 秒容错窗口
    rise        2                                   ! 连续成功 2 次才判定为恢复；2×2 = 4 秒防抖
}

! ── VRRP 实例定义（核心）─────────────────────────────────────────────────
! vrrp_instance 是最核心的配置块，定义一个 VRRP 虚拟路由器实例
! 主备两台机器配置基本一致，只有 state 和 priority 不同
vrrp_instance VI_1 {

    state MASTER                    ! VRRP 初始状态；MASTER = 启动时尝试抢占 VIP
    interface enp125s0f0-br0       ! 绑定物理网卡；VRRP 心跳包和 VIP 都走这张网卡
    virtual_router_id 51           ! VRRP 路由器 ID (0-255)；★ 主备必须一致，同一网段不同集群用不同 ID
    priority 100                   ! 本机优先级 (1-255)；值越大越优先成为 MASTER，MASTER=100 BACKUP=90
    advert_int 1                   ! VRRP 心跳广播间隔（秒）；1 秒 = 快速故障检测；备机 3 秒收不到心跳即接管

    ! ── 单播通信模式 ─────────────────────────────────────────────────
    ! 默认 VRRP 用组播 224.0.0.18，但很多云环境和交换机禁用了组播
    ! 单播模式直接向对方 IP 发送心跳，不受网络设备限制，更可靠
    unicast_peer {
        192.168.131.10       ! app10 的 IP
        192.168.131.11       ! app11 的 IP
    }

    ! ── 认证 ────────────────────────────────────────────────────────
    ! 防止非法节点加入 VRRP 组、防止误配导致冲突
    authentication {
        auth_type PASS             ! 认证类型；PASS = 简单密码认证（VRRP 协议标准）
        auth_pass EctErp1234       ! 认证密码（最长 8 字符）；★ 主备必须完全一致
    }

    ! ── 虚拟 IP 地址（VIP）───────────────────────────────────────────
    ! 谁当选 MASTER 谁就持有这个 IP；客户端统一通过 VIP 访问服务
    virtual_ipaddress {
        10.0.0.30/24 dev enp125s0f0-br0   ! VIP 地址/掩码 绑定到指定网卡
    }

    ! ── 健康检查绑定 ─────────────────────────────────────────────────
    ! 引用上面定义的 vrrp_script，当脚本连续失败时自动降级
    track_script {
        chk_nginx                  ! 绑定 chk_nginx 检查项
    }

    ! ── 状态切换通知回调 ────────────────────────────────────────────
    ! 当 keepalived 状态变化时执行指定命令；这里只用 echo 记录日志
    ! 可以替换为发送告警的脚本（如 curl 企业微信/钉钉 webhook）
    notify_master "/bin/echo '\$(date): 晋升 MASTER, VIP=10.0.0.30' >> /var/log/keepalived-notify.log"
    notify_backup "/bin/echo '\$(date): 降级 BACKUP' >> /var/log/keepalived-notify.log"
    notify_fault  "/bin/echo '\$(date): FAULT 状态! 请立刻排查' >> /var/log/keepalived-notify.log"
}
