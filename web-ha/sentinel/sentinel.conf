# ====================================================================
# Redis Sentinel 配置文件（三机方案：app10 + app11 + 仲裁机）
# ====================================================================
# 部署位置: /opt/redis-ha/sentinel.conf
# app10、app11、仲裁机三台完全一样
#
# 工作原理:
#   1. 3 个 Sentinel 共同监控 192.168.131.10:6379（初始 Master）
#   2. quorum=2: 至少 2 票同意才触发故障切换，防止单 Sentinel 误判
#   3. known-replica: 直接告诉 Sentinel Slave 的 IP，不依赖 Master 的 INFO 输出
#   4. 故障时 Sentinel 选举 leader，leader 选择一个健康的 replica 提升为新 Master
#
# 关键: Sentinel 运行时会自动重写此文件（记录运行时状态）。
# 如果出现 NOGOODSLAVE 错误，需要干净重启所有 Sentinel 清除旧状态。

# ── 监控 Master ──
# sentinel monitor <集群名> <Master IP> <端口> <quorum票数>
sentinel monitor redis-ha 192.168.131.10 6379 2

# ── 认证密码（Master 和 Slave 都用这个密码）──
sentinel auth-pass redis-ha cns@2035

# ── 故障检测 ──
# 连续 N 毫秒收不到 Master 的 PONG，标记主观下线（SDOWN）。
# 内网延迟 <1ms，2 秒足以区分"真的挂了"和"网络抖动"。
# 降低此值 = 更快检测，但也更容易误判（可由其他 Sentinel 交叉验证抵消）。
sentinel down-after-milliseconds redis-ha 2000

# ── 故障切换超时 ──
# 整个 failover 流程的硬上限（毫秒）。超时则放弃并重试。
# 当前场景只有 1 主 1 从，切换不含数据同步，5-10 秒就能完成，设 20 秒足够。
sentinel failover-timeout redis-ha 20000

# ── 并行同步 ──
sentinel parallel-syncs redis-ha 1

# ── 已知 Slave 地址 ──
# 直接告诉 Sentinel Slave 在哪，不依赖 Master INFO replication 输出。
# 这是解决 NOGOODSLAVE 的关键配置 — 特别是远程仲裁机需要这个。
sentinel known-replica redis-ha 192.168.131.11 6379
sentinel known-replica redis-ha 192.168.131.10 6379

# ── Slaves 优先级 ──
# 由 redis-server 的 --replica-priority 控制（docker-compose.yml 中配置）：
#   app10: 100 → 优先选为 Master
#   app11: 50  → 只在 app10 不可用时才被提升

# ── 脑裂预防 ──
# 额外的预防机制（不在 Sentinel 配置中，在宿主机上部署）：
#   1. redis-startup-guard.service — 开机时自动检查，若 Sentinel 说 Master 是别人则立即降级
#   2. sentinel-watchdog.timer     — 每 30 秒检查 Sentinel 是否存活，挂了自动重启
#   3. check-split-brain.timer     — 每 30 秒扫描是否脑裂，发现即告警
# 详见部署手册 7.10 第五步
