# ====================================================================
# Nginx 虚拟主机 — 反向代理 + 健康检查 + 安全控制
# ====================================================================
# 部署路径: /etc/nginx/conf.d/virtual-host.conf

server {
    listen 80;                                              # 监听 HTTP 端口
    server_name _;                                          # 匹配所有域名
    access_log /var/log/nginx/ha-access.log;                # 访问日志（独立于默认日志）
    error_log  /var/log/nginx/ha-error.log warn;            # 错误日志

    # ── 安全控制 ─────────────────────────────────────────────────
    # IP 直接访问 → 444（直接断开连接，不给任何响应）
    if ($is_ip_access) {
        return 444;
    }

    # ── 健康检查端点 ─────────────────────────────────────────────
    # Keepalived 每 2 秒请求此 URL 判断 Nginx 是否存活
    # 外部监控系统也可用此端点做探活
    location = /health {
        access_log off;                                     # 不记录健康检查到访问日志，避免日志膨胀
        return 200 "OK\n";                                  # 返回纯文本 OK
        add_header Content-Type text/plain;
    }

    # ── 反向代理到 Tomcat 后端 ───────────────────────────────────
    location / {
        proxy_pass http://backend_pool;                     # 转发到后端 Tomcat 服务器池
        proxy_http_version 1.1;                             # 使用 HTTP/1.1 支持长连接

        # 请求头透传 — 后端需要知道原始请求信息
        proxy_set_header Host              $host;           # 透传原始域名
        proxy_set_header X-Real-IP         $remote_addr;    # 透传客户端真实 IP
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;  # 记录完整代理链
        proxy_set_header X-Forwarded-Proto $scheme;         # 透传原始协议（http/https）
        proxy_set_header Connection        "";              # 清除 Connection 头，让后端决定

        # 超时 — 覆盖 http 块默认值
        proxy_connect_timeout 5s;                           # 连接后端超时（内网 5 秒足够）
        proxy_send_timeout    60s;                          # 发送请求到后端超时
        proxy_read_timeout    60s;                          # 等待后端响应超时

        # 缓冲 — 覆盖 http 块 proxy_buffering off
        proxy_buffering        on;                          # 开启代理缓冲，保护后端不受慢客户端影响
        proxy_buffer_size      4k;                          # 响应头缓冲区大小
        proxy_buffers          8 16k;                       # 响应体缓冲区：8 个 × 16KB = 128KB
        proxy_busy_buffers_size 32k;                        # 未完全接收时可发送的缓冲大小
    }
}
