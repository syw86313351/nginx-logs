# ====================================================================
# Nginx upstream — 后端 Tomcat 服务器池（由 upstream-health-check.sh 自动维护）
# ====================================================================
# 不要手动编辑此文件！由 systemd timer 自动更新。
# 首次部署时写一份初始配置，后续健康检查脚本每 10 秒检测并更新。

upstream backend_pool {
    least_conn;                                             # 最少连接算法：请求分给当前连接数最少的后端
    server 192.168.1.10:8080 max_fails=1 fail_timeout=10s;  # 后端 Tomcat 1
    server 192.168.1.11:8080 max_fails=1 fail_timeout=10s;  # 后端 Tomcat 2
    keepalive 32;                                           # 后端长连接复用
}
