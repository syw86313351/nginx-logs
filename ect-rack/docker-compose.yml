services:
  db:
    image: mariadb:10.6
    container_name: racktables-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-racktables_root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-racktables}
      MYSQL_USER: ${MYSQL_USER:-racktables}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-racktables_pass}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-9701}:3306"
    networks:
      - racktables-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uracktables", "-pracktables_pass"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  racktables:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: racktables-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-racktables}
      DB_USER: ${MYSQL_USER:-racktables}
      DB_PASS: ${MYSQL_PASSWORD:-racktables_pass}
    ports:
      - "${RACKTABLES_PORT:-9702}:80"
    networks:
      - racktables-net

volumes:
  db_data:
    driver: local

networks:
  racktables-net:
    driver: bridge